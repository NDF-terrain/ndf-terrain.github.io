<title>Clasper Frais</title>
<style>
:root{--primary:#4F8BC8;--accent:#FFD200;--ink:#E6ECE8;--bg:#0E1316;--surface:#182127;--line:#2C3842;--muted:#9AA7A1;--bad:#F07B71;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
input[type=password]{font:inherit;font-size:1.05rem;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--primary);outline-offset:1px}
label.r{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-weight:700;font-size:1rem;padding:12px;border-radius:12px;border:0;background:var(--primary);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--bad);font-weight:650;font-size:.9rem;min-height:1.2em}
</style>

function ouvrir(cle){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},cle,b64(D.ct)).then(function(buf){

function deriver(mdp){return crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveKey"]).then(function(k){
